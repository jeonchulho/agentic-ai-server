version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: agentic-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agentic_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-network

  # Milvus Standalone (Vector Database)
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - agentic-network

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - agentic-network

  milvus:
    image: milvusdb/milvus:v2.3.5
    container_name: milvus-standalone
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - agentic-network

  # FastAPI Application
  app:
    build: .
    container_name: agentic-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      # Database
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: agentic_ai
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # OpenAI (set your API key)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_api_key_here}
      # Legacy DB (configure if needed)
      LEGACY_DB_HOST: ${LEGACY_DB_HOST:-localhost}
      LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
      LEGACY_DB_USER: ${LEGACY_DB_USER:-legacy_user}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-legacy_password}
      LEGACY_DB_NAME: ${LEGACY_DB_NAME:-legacy_db}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - upload_data:/tmp/uploads
    networks:
      - agentic-network

volumes:
  mysql_data:
  redis_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  upload_data:

networks:
  agentic-network:
    driver: bridge
